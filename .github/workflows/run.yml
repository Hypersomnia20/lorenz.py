name: 🦋 洛伦兹吸引子蝴蝶效应生成器

on:
  push:                # 代码推送时触发
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  generate-image:
    runs-on: ubuntu-latest  # 使用最新 Ubuntu 系统
    
    steps:
    # 第一步：获取代码
    - name: 🛰️ 拉取代码
      uses: actions/checkout@v4
    
    # 第二步：设置 Python 环境
    - name: 🐍 安装 Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    # 第三步：安装数学库
    - name: 📦 安装依赖
      run: |
        pip install numpy matplotlib
    
    # 第四步：运行洛伦兹方程
    - name: 🎨 生成蝴蝶效应图
      run: python lorenz.py
    
    # 第五步：保存结果
    - name: ⬆️ 上传生成图片
      uses: actions/upload-artifact@v3
      with:
        name: butterfly-result
        path: output/butterfly.png
    
    # 第六步：自动发布到网页
    - name: 🚀 部署到 GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./output
